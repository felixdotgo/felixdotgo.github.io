{{ define "main" }}
  <div class="tag-page">
    <div class="tag-page-header">
      <h1>{{ .Title }}</h1>
      <div class="tag-name">All {{ lower .Title }}</div>
    </div>

    {{ $terms := .Data.Terms.Alphabetical }}
    {{ if gt (len $terms) 0 }}
      <ul class="posts">
        {{ range $terms }}
          <li>
            <a class="post-link" href="{{ .Page.RelPermalink }}">
              <h2 class="post-title">{{ lower .Page.LinkTitle }}</h2>
            </a>
            <div class="post-meta">
              <div class="post-date">{{ .Count }} posts</div>
            </div>
          </li>
        {{ end }}
      </ul>
    {{ else }}
      <p style="color: var(--text-muted); font-family: 'Roboto Mono', monospace; font-size: 14px;">Nothing published here yet.</p>
    {{ end }}
  </div>
{{ end }}
